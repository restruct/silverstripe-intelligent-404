# Own fixture (not Intelligent404Test.yml) so these pages cannot collide with the fuzzy-matching tests.
SilverStripe\CMS\Model\SiteTree:
  news:
    Title: News
    URLSegment: news
  results:
    Title: Our team's results
    URLSegment: our-teams-results
    Parent: =>SilverStripe\CMS\Model\SiteTree.news
  about:
    Title: About us
    URLSegment: about-us
  # Published but only for logged-in members: never a redirect target for an anonymous visitor
  membersonly:
    Title: Members only
    URLSegment: members-only
    CanViewType: LoggedInUsers
  # Never published in setUp(): proves a page only in draft is no redirect target
  draftonly:
    Title: Draft only
    URLSegment: draft-only

SilverStripe\ErrorPage\ErrorPage:
  e404:
    Title: Page not found
    URLSegment: page-not-found
    ErrorCode: 404
    Content: '<p>Sorry, not found.</p>'
