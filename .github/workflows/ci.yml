name: CI

on:
  push:
    # The repository's default branch (checked with `gh api repos/restruct/silverstripe-intelligent-404
    # --jq .default_branch` on 2026-09-24).
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it. Silverstripe 4 is end of life and not tested.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_ci
      SS_ENVIRONMENT_TYPE: dev

    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. The host
        # composer.json is written by hand: recipe-cms is the thing to require, there is no
        # skeleton package to create-project from.
        #
        # The module is pulled in through a PATH repository pointing at the checkout, symlinked
        # rather than mirrored ON PURPOSE: /tests is export-ignore in .gitattributes, so a mirrored
        # (dist-style) install would contain no tests at all and the suite would pass with nothing
        # in it.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-intelligent-404": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\Silverstripe\\\\Intelligent404\\\\Tests\\\\": "vendor/restruct/silverstripe-intelligent-404/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Every Silverstripe 5 release of silverstripe/cms is covered by advisory
          # PKSA-pjvm-vnw2-n3m2 (range <6.2.1), which will not be patched on the 5 line, so
          # Composer refuses to install it under the default policy. Disabled HERE ONLY, in a
          # throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg.
               failOnEmptyTestSuite: a suite that finds no tests fails instead of passing. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true" failOnEmptyTestSuite="true">
              <testsuites>
                  <testsuite name="intelligent404">
                      <directory>vendor/restruct/silverstripe-intelligent-404/tests</directory>
                      <!-- Playwright specs and their fixtures, run by the Browser tests workflow -->
                      <exclude>vendor/restruct/silverstripe-intelligent-404/tests/browser</exclude>
                  </testsuite>
                  <testsuite name="consumer">
                      <directory>app/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Add a consumer-shape database test
        # This module ships a DataObject fixture in tests/. In test mode a CONSUMING project's
        # manifest includes it, and an unbuildable fixture there would fatal every consumer's
        # temp-database build. The module's own suite cannot catch that (PHPUnit loads its
        # fixtures directly), so a plain database test from the host's side does.
        run: |
          mkdir -p app-host/app/tests
          cat > app-host/app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP

      - name: Run tests (Silverstripe 5)
        if: matrix.silverstripe == '5'
        working-directory: app-host
        # PHPUnit 9 on framework 5 flushes the test manifest through a PATH-FIRST `flush=1`
        # argument (PHPUnit aborts with 'Cannot open file "flush=1"' unless the path comes first);
        # SS_PHPUNIT_FLUSH is inert on framework 5.
        # --fail-on-empty-test-suite: a run that finds no tests fails instead of passing green.
        run: |
          vendor/bin/phpunit vendor/restruct/silverstripe-intelligent-404/tests flush=1 \
            --fail-on-empty-test-suite
          vendor/bin/phpunit app/tests flush=1 --fail-on-empty-test-suite

      - name: Run tests (Silverstripe 6)
        if: matrix.silverstripe == '6'
        working-directory: app-host
        env:
          # PHPUnit 11 treats a bare `flush=1` argument as a test path and aborts ('Test file
          # "flush=1" not found'), so the manifest is flushed through this.
          SS_PHPUNIT_FLUSH: 1
        run: |
          vendor/bin/phpunit --testsuite intelligent404 --fail-on-empty-test-suite
          vendor/bin/phpunit --testsuite consumer --fail-on-empty-test-suite

      - name: Boot the app and build the database (Silverstripe 5)
        # The suite proves the extension behaves; this proves the module does not break a real
        # boot, including the static error pages dev/build renders through the extension.
        if: matrix.silverstripe == '5'
        working-directory: app-host
        run: vendor/bin/sake dev/build flush=1

      - name: Boot the app and build the database (Silverstripe 6)
        if: matrix.silverstripe == '6'
        working-directory: app-host
        run: vendor/bin/sake db:build --flush

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the module's declared php constraint and the newest PHP tested above.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
